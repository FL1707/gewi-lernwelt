<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gewi-Lernwelt Klasse 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f3ea;--ink:#25232b;--muted:#6c6774;--card:#fff;--line:#e8e0cf;--ok:#2f9e6e;--bad:#d64545;--maybe:#e8a33d;--sea:#cfe5f1;--land:#efe3c6;--c:#e4572e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3,h4{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.2}
a{color:inherit}
button{font:inherit;cursor:pointer;color:inherit}
.hidden{display:none!important}
/* Start */
.hero{background:linear-gradient(135deg,#2f7fb8,#6d5bd0);color:#fff;padding:34px 18px 54px}
.hero-in{max-width:900px;margin:0 auto}
.pill{display:inline-block;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:99px;font-size:13px;font-weight:700}
.hero h1{font-size:clamp(34px,8vw,52px);margin:10px 0 6px}
.hero p{margin:0 0 16px;max-width:560px;opacity:.95}
.total{display:flex;align-items:center;gap:12px;font-weight:800;font-size:15px}
.bar{flex:1;max-width:260px;height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffd166;border-radius:99px}
.grid{max-width:900px;margin:-30px auto 0;padding:0 14px 20px;display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:680px){.grid{grid-template-columns:1fr 1fr}}
.chcard{position:relative;display:flex;gap:14px;align-items:center;background:var(--card);border-radius:20px;padding:16px;text-decoration:none;box-shadow:0 2px 0 var(--line),0 8px 24px rgba(40,30,10,.06);border-left:7px solid var(--c);transition:transform .15s}
.chcard:active{transform:scale(.98)}
.chnum{position:absolute;top:10px;right:14px;font-family:Fredoka;color:#d8d0c0;font-size:22px}
.chemoji{font-size:38px;width:56px;height:56px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:16px;flex:0 0 auto}
.chtxt{display:flex;flex-direction:column;min-width:0}
.chtxt b{font-family:Fredoka;font-weight:600;font-size:19px}
.chtxt span{color:var(--muted);font-size:14px}
.chmeta{display:flex;gap:10px;align-items:center;margin-top:4px}
.exc{font-size:13px;color:var(--muted);font-weight:700}
.star{color:#ddd3bf;font-size:18px}.star.on{color:#f4b400}
.stars.big .star{font-size:34px}
.foot{max-width:900px;margin:10px auto 40px;padding:0 18px;color:var(--muted);font-size:13px}
.link{background:none;border:0;text-decoration:underline;color:var(--muted);padding:0}
/* Kapitel */
.chhead{background:var(--c);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.back{display:inline-block;color:#fff;text-decoration:none;font-weight:800;font-size:15px;opacity:.9;padding:4px 0}
.chtitle{display:flex;align-items:center;gap:12px;max-width:900px;margin:4px auto 10px}
.chtitle .chemoji{background:rgba(255,255,255,.2);width:48px;height:48px;font-size:30px}
.chtitle small{opacity:.85;font-weight:700}
.chtitle h1{margin:0;font-size:clamp(22px,5.5vw,30px)}
.tabs{display:flex;gap:4px;max-width:900px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;white-space:nowrap;background:rgba(255,255,255,.16);border:0;color:#fff;font-weight:800;padding:11px 6px;border-radius:14px 14px 0 0;font-size:14.5px}
.tabs button.on{background:var(--bg);color:var(--ink)}
.content{max-width:820px;margin:0 auto;padding:18px 16px 30px}
.chnav{max-width:820px;margin:0 auto 40px;padding:0 16px;display:flex;justify-content:space-between;gap:10px;font-weight:800}
.chnav a{text-decoration:none;color:var(--muted)}
/* Lernen */
.learn h3{font-size:21px;margin:26px 0 8px}
.learn p,.learn li{margin:6px 0}
.learn ul{padding-left:22px}
.box{border-radius:16px;padding:14px 16px;margin:14px 0}
.box.def{background:#fff;border:2px solid var(--c)}
.box.tip{background:#fff6dc;border:2px dashed #f2c14e}
.split,.three{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:600px){.split{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}}
.tile{background:#fff;border-radius:16px;padding:14px;border:1.5px solid var(--line);margin:6px 0}
.tile p{margin:4px 0 0;font-size:15px}
.big{font-size:30px;line-height:1.1;margin-bottom:4px}
.c-geo{border-color:#2f9e6e;background:#eefaf3}.c-ges{border-color:#c78a3b;background:#fdf4e7}.c-pol{border-color:#2f7fb8;background:#ecf4fb}
.area,.src{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:16px;padding:14px;margin:10px 0;border:1.5px solid var(--line)}
.area p,.src p{margin:4px 0 0;font-size:15px}
.ex{color:var(--muted);font-style:italic}
.tbl{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:15px;margin:8px 0}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{background:color-mix(in srgb,var(--c) 15%,#fff)}
.eras{display:grid;gap:10px}
.era{border-radius:16px;padding:12px 14px;color:#222;border-left:8px solid}
.era>b{font-family:Fredoka;font-size:19px;font-weight:600;display:block}.era>span{font-size:13px;font-weight:800;opacity:.75}
.era ul{margin:6px 0 0;padding-left:20px;font-size:15px}
.e1{background:#fde7e1;border-color:#e4572e}.e2{background:#e6f4ea;border-color:#2f9e6e}.e3{background:#fff2d6;border-color:#e8a33d}.e4{background:#e7eefb;border-color:#2f7fb8}
.ocean-cards .tile{display:block}
.oc1{border-color:#1b6ca8}.oc2{border-color:#2a9d8f}.oc3{border-color:#6d5bd0}
.legend{font-size:13px;color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.profile{background:#fff;border-radius:16px;padding:14px;border-top:6px solid var(--c);box-shadow:0 2px 0 var(--line)}
.profile h4{margin:0;font-size:20px}.profile .sub{color:var(--muted);font-size:14px;font-style:italic}
.pmeta{display:flex;flex-direction:column;gap:2px;font-size:13px;font-weight:800;margin:8px 0;color:#4b4655}
.profile ul{padding-left:18px;margin:4px 0;font-size:15px}
.tree{background:#fff;border-radius:16px;padding:14px;border:1.5px solid var(--line)}
.tree-col{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;align-items:end}
.tree-apes{background:#f1ece2;border-radius:12px;padding:10px;font-size:14px;align-self:start;margin-top:0}
.tree-apes b,.tnode b,.tree-root b{display:block;font-family:Fredoka;font-weight:500}
.tree-apes span,.tnode span,.tree-root span{font-size:12.5px;color:var(--muted)}
.tree-main{display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--c);padding-left:10px}
.tnode{background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:10px;padding:6px 10px}
.tnode.t4{margin-left:22px;border:2px dashed color-mix(in srgb,var(--c) 40%,#fff)}
.tree-root{margin-top:8px;background:#6b5d4a;color:#fff;border-radius:12px;padding:10px;text-align:center}
.tree-root span{color:#e8ddcb}
.small{font-size:13px;color:var(--muted)}
.rose-wrap{max-width:260px;margin:0 auto}
.rose{width:100%;height:auto;display:block}
.r-ring{fill:#fff;stroke:#d6ccb8;stroke-width:2}
.r-main{fill:var(--c)}.r-main2{fill:color-mix(in srgb,var(--c) 55%,#000)}
.r-sub{fill:#c9c1b3}.r-sub2{fill:#9b9283}.r-mid{fill:#fff;stroke:#555;stroke-width:2}
.r-lbl{font-family:Fredoka;font-size:17px;text-anchor:middle;dominant-baseline:middle;fill:#555}.r-lbl.main{font-size:24px;fill:var(--ink);font-weight:600}
.rose-small{max-width:170px;margin:0 auto 6px}
.next{text-align:center;margin-top:24px}
/* Karten */
.map{background:#fff;border-radius:16px;padding:6px;border:1.5px solid var(--line);margin:10px 0}
.mapsvg{width:100%;height:auto;display:block;max-height:72vh}
.map.tap .mapsvg{cursor:crosshair}
.m-sea{fill:var(--sea)}.m-grat{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:.6}
.m-land{fill:var(--land);stroke:#b9a882;stroke-width:.7;stroke-linejoin:round}
.m-land.m-good{fill:#9fd8b6;stroke:#2f9e6e}
.m-lake{fill:var(--sea);stroke:#b9a882;stroke-width:.6}
.m-edge{fill:none;stroke:#8fb3c9;stroke-width:1.4}
.m-lbl{font-family:Fredoka;font-size:16px;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;fill:#2b2a33}
.m-lbl.ocean{fill:#1b5f8f;font-style:italic;font-size:17px}
.m-star{font-size:18px;fill:#d62828;text-anchor:middle;dominant-baseline:middle}
.m-num{fill:#25232b;stroke:#fff;stroke-width:3}
.m-numt{fill:#fff;font-family:Fredoka;font-size:16px;text-anchor:middle}
.m-hit{stroke:#fff;stroke-width:3}.m-hit.ok{fill:var(--ok)}.m-hit.bad{fill:var(--bad)}
.ask{font-size:19px;background:#fff;border-radius:14px;padding:10px 14px;border:2px solid var(--c);display:flex;justify-content:space-between;align-items:center;gap:8px}
.cnt{font-size:13px;color:var(--muted);font-weight:800}
/* Üben */
.exlist{display:flex;flex-direction:column;gap:10px}
.exitem{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;text-align:left}
.exitem .exn{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,#fff);font-weight:800;flex:0 0 auto}
.exitem.done .exn{background:var(--ok);color:#fff}
.ext{flex:1;display:flex;flex-direction:column}.ext small{color:var(--muted)}
.go{font-size:26px;color:var(--muted)}
.exhead h2{margin:8px 0 4px;font-size:24px}
.back2{background:none;border:0;color:var(--muted);font-weight:800;padding:4px 0}
.note{color:#4b4655;margin:6px 0 12px}
.btn{display:inline-block;background:var(--c);color:#fff;border:0;border-radius:14px;padding:12px 18px;font-weight:800;margin:10px 6px 0 0;text-decoration:none;font-size:16px;min-height:46px}
.btn.small{padding:9px 14px;min-height:40px;font-size:15px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:4px}
.q{background:#fff;border-radius:18px;padding:16px;margin:12px 0;border:1.5px solid var(--line);scroll-margin-top:170px}
.qtext{font-weight:800;font-size:18px;margin-bottom:10px}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:#faf7f0;border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700}
.opt.ok{background:#e3f6ec;border-color:var(--ok)}.opt.bad{background:#fde6e6;border-color:var(--bad)}
textarea.ans{width:100%;font:inherit;border:2px solid var(--line);border-radius:14px;padding:10px 12px;resize:vertical;background:#fffdf8}
textarea.ans:focus,.lblrow input:focus{outline:none;border-color:var(--c)}
textarea.ans.big{min-height:170px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:14px;padding:10px 14px;margin-top:10px;font-weight:700}
.fb.ok{background:#e3f6ec;color:#1d6b49}.fb.bad{background:#fde6e6;color:#9b2c2c}.fb.maybe{background:#fff3dc;color:#7a4f0e}
.muster{font-weight:600;color:var(--ink);margin-top:4px}.muster small{display:block;color:var(--muted);font-weight:800}
.self{margin-top:6px}
.prog{font-weight:800;color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips.center{justify-content:center}
.chip{background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:15px;text-align:left}
.chip.big{font-family:Fredoka;font-size:20px;min-width:56px;text-align:center}
.chip.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent)}
.chip.wrong,.slot.wrong circle,.cell.wrong{animation:shake .35s;border-color:var(--bad)!important;background:#fde6e6!important}
.chip.placed{background:#e3f6ec;border-color:#bfe5cf;font-size:14px;padding:6px 10px;cursor:default}
.cats{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:600px){.cats.n2{grid-template-columns:1fr 1fr}.cats.n3{grid-template-columns:1fr 1fr 1fr}.cats.n4{grid-template-columns:1fr 1fr}}
.cat{background:#fff;border:2px dashed color-mix(in srgb,var(--c) 45%,#fff);border-radius:16px;padding:10px;min-height:76px;cursor:pointer}
.cat.nudge{animation:shake .3s}
.cath{font-family:Fredoka;font-weight:500;font-size:17px;margin-bottom:6px}
.catb{display:flex;flex-wrap:wrap;gap:6px}
.olist{background:#fff;border-radius:16px;padding:12px 12px 12px 38px;border:1.5px solid var(--line);min-height:50px}
.olist li{padding:4px 0;font-weight:700}
.rose-ex{max-width:330px;margin:0 auto}
.rose-ex svg{width:100%;overflow:visible}
.slot{cursor:pointer}.slot circle{fill:#fff;stroke:var(--c);stroke-width:2.5;stroke-dasharray:4 3}
.slot text{font-family:Fredoka;font-size:17px;text-anchor:middle;fill:var(--muted)}
.slot.filled circle{fill:var(--c);stroke-dasharray:none}.slot.filled text{fill:#fff;font-size:18px}
.steps{background:#fff;border-radius:16px;padding:12px 12px 12px 34px;border:1.5px solid var(--line)}
.steps li{padding:3px 0;color:var(--muted)}.steps li.now{color:var(--ink);font-weight:800}.steps li.ok{color:var(--ok);text-decoration:line-through}
.gridwrap{max-width:380px;margin:12px auto;text-align:center}
.gN{font-family:Fredoka;font-size:18px;color:var(--c);margin-bottom:4px}
.grid8{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;background:var(--line);padding:3px;border-radius:10px}
.cell{aspect-ratio:1;background:#fff;border:0;border-radius:5px;font-size:18px;font-weight:800;padding:0;color:var(--c)}
.cell.start{background:#ffe9a8;color:var(--ink)}.cell.hit{background:color-mix(in srgb,var(--c) 18%,#fff)}
.lblform{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:560px){.lblform{grid-template-columns:1fr 1fr}}
.lblrow{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 8px}
.lblrow.ok{border-color:var(--ok);background:#effaf4}.lblrow.bad{border-color:var(--bad)}.lblrow.shown{border-color:var(--maybe);background:#fff8ea}
.lnum{width:30px;height:30px;border-radius:50%;background:#25232b;color:#fff;display:grid;place-items:center;font-family:Fredoka;flex:0 0 auto}
.lblrow input{flex:1;border:0;font:inherit;background:transparent;padding:6px;min-width:0}
.kw{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}.kw span{background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:99px;padding:4px 10px;font-size:14px;font-weight:700}
.finish{text-align:center;background:#fff;border-radius:18px;padding:20px;margin:16px 0;border:2px solid var(--ok)}
.finish .big{font-size:44px}.finish b{font-size:19px;display:block;margin-bottom:6px}
.finish .row{justify-content:center}
.testintro{text-align:center;background:#fff;border-radius:20px;padding:24px 18px;border:1.5px solid var(--line)}
.testintro .big{font-size:50px}.testintro h2{margin:6px 0}
/* Lernkarten */
.fcwrap{max-width:460px;margin:0 auto;text-align:center}
.fcprog{color:var(--muted);font-weight:800;font-size:14px;margin-bottom:8px}
.fc{width:100%;background:none;border:0;padding:0;perspective:1000px;height:250px}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;gap:8px}
.fc-f{background:var(--c);color:#fff}.fc-f span{font-family:Fredoka;font-size:28px;font-weight:600}.fc-f small{opacity:.8}
.fc-b{background:#fff;border:3px solid var(--c);transform:rotateY(180deg)}.fc-b b{font-family:Fredoka;font-weight:500;color:var(--c)}.fc-b span{font-size:18px;font-weight:700}
.fcwrap .row{justify-content:center;margin-top:8px}
@media (prefers-reduced-motion: reduce){.fc-in{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>/*D3*/</script>
<script>/*GEO*/</script>
<script>/*CONTENT*/</script>
<script>/*APP*/</script>
</body>
</html>
